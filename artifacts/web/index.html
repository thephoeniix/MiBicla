    />

    <meta property="og:description" content="Taller de bicicletas, productos, eventos y comunidad MTB en Querétaro." />

    <meta name="twitter:card" content="summary" />

    <meta name="twitter:image" content="https://mibiclaqro.com/pink-simple.png" />
    <style>
      .brand-preloader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f8f8fa;
        background:
          radial-gradient(circle at 50% 45%, rgb(245 17 104 / .2), transparent 28%),
          #070709;
        transition: opacity .38s ease, visibility .38s ease;
      }
      .brand-preloader::before {
        position: absolute;
        width: min(82vw, 520px);
        aspect-ratio: 1;
        content: "";
        border: 1px solid rgb(245 17 104 / .22);
        border-radius: 50%;
        box-shadow: 0 0 80px rgb(245 17 104 / .12), inset 0 0 70px rgb(245 17 104 / .08);
        animation: preloader-ring 2.4s linear infinite;
      }
      .brand-preloader::after {
        position: absolute;
        width: min(64vw, 390px);
        aspect-ratio: 1;
        content: "";
        border: 2px dashed rgb(255 255 255 / .12);
        border-radius: 50%;
        animation: preloader-ring 8s linear infinite reverse;
      }
      .brand-preloader__content {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        gap: 12px;
        text-align: center;
      }
      .brand-preloader__logo {
        position: relative;
        display: grid;
        width: 116px;
        height: 116px;
        place-items: center;
      }
      .brand-preloader__logo::before {
        position: absolute;
        inset: -10px;
        content: "";
        border: 3px solid transparent;
        border-top-color: #f51168;
        border-right-color: rgb(245 17 104 / .28);
        border-radius: 50%;
        animation: preloader-ring .9s linear infinite;
      }
      .brand-preloader__logo img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgb(245 17 104 / .45));
        animation: preloader-logo 1.15s ease-in-out infinite alternate;
      }
      .brand-preloader strong {
        font-family: "Barlow Condensed", Impact, sans-serif;
        font-size: clamp(2.5rem, 10vw, 4.2rem);
        font-style: italic;
        letter-spacing: -.02em;
        line-height: .85;
      }
      .brand-preloader strong span { color: #f51168; }
      .brand-preloader small {
        color: #aaaab3;
        font-family: "Manrope", Arial, sans-serif;
        font-size: .66rem;
        font-weight: 800;
        letter-spacing: .25em;
        text-transform: uppercase;
      }
      .brand-preloader__track {
        position: relative;
        width: 150px;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        background: rgb(255 255 255 / .12);
        border-radius: 999px;
      }
      .brand-preloader__track::after {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(90deg, transparent, #f51168, transparent);
        transform: translateX(-100%);
        animation: preloader-track 1s ease-in-out infinite;
      }
      .brand-preloader.is-leaving { opacity: 0; visibility: hidden; }
      @keyframes preloader-ring { to { transform: rotate(360deg); } }
      @keyframes preloader-logo { to { transform: scale(1.06) rotate(-2deg); } }
      @keyframes preloader-track { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        .brand-preloader *, .brand-preloader::before, .brand-preloader::after { animation: none !important; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("mb_theme");
          const preference = ["light", "dark"].includes(saved) ? saved : "system";
          const dark = preference === "dark" ||
            (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePreference = preference;
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#110f10" : "#f7f6f7");
        } catch {
          document.documentElement.dataset.theme =
            matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.themePreference = "system";
        }
      })();
    </script>
    <title>Mi Bicla Querétaro</title>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SportingGoodsStore","name":"Mi Bicla Querétaro","url":"https://mibiclaqro.com/","logo":"https://mibiclaqro.com/pink-simple.png","description":"Taller de bicicletas, productos, eventos y comunidad MTB en Querétaro."}
    </script>
  </head>
  <body>
    <div class="brand-preloader" id="brand-preloader" role="status" aria-label="Cargando Mi Bicla">
      <div class="brand-preloader__content">
        <span class="brand-preloader__logo"><img src="/pink-simple.png" alt="" /></span>
        <strong>MI <span>BICLA</span></strong>
        <small>Listos para rodar</small>
        <span class="brand-preloader__track" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src.tsx"></script>
    <script>
      (() => {
        const loader = document.getElementById("brand-preloader");
        const started = performance.now();
        let firstLoad = true;
        try { firstLoad = sessionStorage.getItem("mb_preloader_seen") !== "1"; } catch { /* Sigue sin persistencia. */ }
        let finished = false;
        const finish = () => {
          if (finished || !loader) return;
          finished = true;
          try { sessionStorage.setItem("mb_preloader_seen", "1"); } catch { /* Sigue sin persistencia. */ }
          const delay = Math.max(0, (firstLoad ? 850 : 80) - (performance.now() - started));
          setTimeout(() => {
            loader.classList.add("is-leaving");
            setTimeout(() => loader.remove(), 420);
          }, delay);
        };
        addEventListener("mb:app-ready", finish, { once: true });
        setTimeout(finish, 5000);
      })();
    </script>
  </body>
</html>
